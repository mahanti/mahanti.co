<!DOCTYPE html>
<html lang="en">
<head>
  <script defer src="/js/logo-hover.js"></script>
  <script type="module" src="/js/lisse-images.js"></script>
  <meta charset="utf-8">
  <script src="/js/site-clock.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arjun Mahanti</title>
  <meta name="description" content="A multidisciplinary designer building delightful solutions to complex problems.">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    [data-animate] {
      --stagger: 0;
      --delay: 120ms;
      --start: 0ms;
      animation: fade-in-up 0.6s both;
      animation-delay: calc(var(--stagger) * var(--delay) + var(--start));
    }
    [data-animation-controller="false"] [data-animate] {
      animation: none;
    }
    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animate] { animation: none; }
    }
    .grid.page-content {
      padding-bottom: 24px;
    }
    .home-page .home-carousel img {
      border-radius: 0;
    }
  </style>
  <script src="/js/min.script.js"></script>
  <script src="https://unpkg.com/embla-carousel@8.6.0/embla-carousel.umd.js"></script>
  <script src="/js/embla-auto-scroll.js"></script>
  <script src="https://unpkg.com/embla-carousel-wheel-gestures/embla-carousel-wheel-gestures.umd.js"></script>
  <script src="/js/medium-zoom.min.js"></script>
</head>
<body class="day home-page">

    
    
    
    <div class="grid page-content animate-page" data-animation-controller="true">
        <!-- Static Header with Navigation -->
        <header id="nav" class="static-header" data-animate style="--stagger:1">
            <div class="col-8 row">
              <div class="header-top">
                <a href="/" class="logo-link" aria-label="Home">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="site-logo" aria-hidden="true">
                    <rect width="24" height="24" rx="6" fill="var(--surface-10)" opacity="0.4"/>
                    <g opacity="0.6">
                      <path d="M18.1304 14.798L14.8701 9.34082M12.2914 14.798L9.03112 9.34082L5.86968 14.798" stroke="var(--text-base)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </g>
                  </svg>
                </a>
              </div>
              <div class="header-home-content mb-24">
                <a href="/" id="name" class="title">Arjun Mahanti</a>
                <span class="subtitle hideable">Hi, I’m Arjun, a multidisciplinary designer from Brooklyn. I’m designing Bitcoin and AI products at Block, building iOS apps at my personal studio, and looking for delightful solutions to complex problems.
                </span>
                <nav class="header-nav" style="margin-top: 16px;">
                  <a href="/work" class="button-link">Work</a>
                  <a href="/products" class="button-link">Products</a>
                  <a href="/photos" class="button-link">Photos</a>
                  <a href="/about" class="button-link">About</a>
                </nav>
              </div>
            </div>
        </header>
        
        <!-- Content Container -->
        <div id="spa-content" class="spa-content-container" data-animate style="--stagger:2">
          <div class="embla embla-auto carousel home-carousel mb-24" data-animate style="--stagger:3">
            <div class="wrapper">
              <div class="carousel-slide">
                <img src="/img/carousel/01.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/10.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/02.png" class="image-border" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/03.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/08.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/04.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/07.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/05.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
              <div class="carousel-slide">
                <img src="/img/carousel/06.jpg" width="1200" height="800" loading="eager" decoding="async" alt="">
              </div>
            </div>
          </div>

        </div>
    </div>
    
    <script data-site-enhance>
      (() => {
        const root = document.querySelector('[data-animation-controller]');
        if (root) {
          const candidates = root.querySelectorAll(
            '[data-animate], .carousel, section, hr.divider, footer.site-footer'
          );
          candidates.forEach(el => {
            if (!el.hasAttribute('data-animate')) {
              el.setAttribute('data-animate', '');
            }
          });
          const targets = root.querySelectorAll('[data-animate]');
          targets.forEach((el, i) => {
            if (!el.style.getPropertyValue('--stagger')) {
              el.style.setProperty('--stagger', String(i + 1));
            }
          });
        }

      })();
    </script>
    <script src="/js/script.js"></script>
</body>
</html>
