<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="/js/site-haptics.js?v=tap-surfaces"></script>
  <meta name="robots" content="noindex">
  <title>Vector playground · Arjun Mahanti</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="./playground.css">
  <link rel="stylesheet" href="/mangostudios/lib/dialkit-2.2.1/styles.css">
  <script type="module" src="./playground.js?v=hover-divider"></script>
</head>
<body>
<label class="site-haptic-surface" for="site-haptic-switch" style="display:contents" role="presentation">
  <main>
    <h1>Vector playground</h1>
    <div class="workspace">
      <section aria-label="Preview">
        <vector-reveal src="/img/work/proto/connector.svg" aria-label="Connector" position="12"></vector-reveal>
        <p class="hint">Drag across the mark to reveal its curves.</p>
        <div class="specimens" role="group" aria-label="Choose a specimen"></div>
      </section>
      <aside id="settings" aria-label="DialKit settings"></aside>
    </div>
  </main>
</label>
</body>
</html>
