<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="/js/site-haptics.js"></script>
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Perspective lines — motion study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #aaa69a; font: 13px/1.4 system-ui, sans-serif; }
    main { min-height: 100svh; display: grid; place-content: center; padding: 24px; }
    .study { width: min(960px, calc(100vw - 48px)); }
    perspective-lines { --perspective-background: url("./sky-4.jpg"); display: block; width: 100%; aspect-ratio: 704 / 369; border-radius: 4px; overflow: hidden; }
    .controls { display: flex; align-items: center; gap: 24px; margin-top: 22px; }
    button, select { font: inherit; color: inherit; background: transparent; border: 0; padding: 6px 0; cursor: pointer; }
    button { min-width: 46px; text-align: left; }
    button:active { transform: scale(.98); }
    button:hover, select:hover { color: #eee6cb; }
    :focus-visible { outline: 1px solid #dd7c39; outline-offset: 5px; }
    label { display: flex; gap: 10px; align-items: center; }
    select { color-scheme: dark; }
    .caption { margin-left: auto; color: #77746d; }
    @media (max-width: 500px) { main { padding: 16px; } .study { width: calc(100vw - 32px); } .caption { display: none; } }
  </style>
  <script src="./perspective-lines.js" defer></script>
</head>
<body>
  <main>
    <div class="study">
      <perspective-lines role="img" aria-label="Fine ivory lines recede slowly toward an orange horizon over a softly colored sky."></perspective-lines>
      <div class="controls">
        <button id="toggle" type="button">Pause</button>
        <label>Speed <select id="speed" aria-label="Animation speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
        <span class="caption">Perspective study · 01</span>
      </div>
    </div>
  </main>
  <script>
    customElements.whenDefined('perspective-lines').then(() => {
      const scene = document.querySelector('perspective-lines');
      const toggle = document.querySelector('#toggle');
      const sync = () => { toggle.textContent = scene.paused ? 'Play' : 'Pause'; };
      toggle.addEventListener('click', () => { scene.paused = !scene.paused; sync(); });
      scene.addEventListener('playstatechange', sync);
      document.querySelector('#speed').addEventListener('change', event => { scene.speed = Number(event.target.value); });
      sync();
    });
  </script>
</body>
</html>
