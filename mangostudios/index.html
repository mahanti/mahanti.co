<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Mango Studios</title>
  {% include link-preview.html %}
  <script src="/js/site-clock.js"></script>
  <script>
    if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embedded');
  </script>
  <style>
    body {
      margin: 0;
      background: #ffffff;
    }

    main {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      touch-action: pinch-zoom;
      -webkit-tap-highlight-color: transparent;
    }

    .backdrop:focus-visible {
      outline: 2px solid #794300;
      outline-offset: -4px;
    }

    .letter-depth {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    main > svg {
      position: relative;
      pointer-events: none;
      width: min(82vw, 720px, 150vh);
      overflow: visible;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      main > svg { animation: wordmark-enter 600ms ease 120ms backwards; }

      @keyframes wordmark-enter {
        from { opacity: 0; transform: translateY(10px); filter: blur(8px); }
        to { opacity: 1; transform: none; filter: none; }
      }
    }

    main path {
      outline: none;
      cursor: grab;
      pointer-events: visiblePainted;
      transition: fill 140ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    main path[data-rocking] {
      fill: var(--lit-face) !important;
      transition: none;
    }

    main path.dragging { cursor: grabbing; }
    main path:focus { outline: none; }
    main path:focus-visible {
      stroke: #794300;
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .cursor-dot {
      display: none;
      position: fixed;
      top: -8px;
      left: -8px;
      width: 16px;
      height: 16px;
      pointer-events: none;
      z-index: 1;
    }

    .cursor-dot::before {
      content: "";
      display: block;
      height: 100%;
      border-radius: 50%;
      background: currentColor;
      background: color-mix(in display-p3, currentColor 90%, black);
      transform: var(--stretch, none);
      transition: transform 140ms cubic-bezier(.23, 1, .32, 1),
                  scale 230ms cubic-bezier(.2, 1.55, .35, 1),
                  background-color 140ms cubic-bezier(.23, 1, .32, 1);
    }

    .cursor-dot.pressed::before {
      scale: .68;
      transition-duration: 140ms, 75ms, 140ms;
      transition-timing-function: cubic-bezier(.23, 1, .32, 1);
    }

    @media (any-hover: hover) and (any-pointer: fine) and (forced-colors: none) {
      .dot-active main, .dot-active main * { cursor: none !important; }
      .dot-active .cursor-dot { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor-dot::before, .cursor-dot.pressed::before { transform: none; transition: none; }
    }
    .embedded body {
      background: color-mix(in display-p3, var(--average-ink, color(display-p3 0.9451 0.5451 0.0078)) 15%, transparent);
      transition: background-color 140ms ease-out;
    }
    .embedded main {
      height: 100vh;
      min-height: 0;
      grid-template-columns: minmax(0, 1fr);
    }
    .embedded main > svg {
      animation: none;
    }
    .embedded .backdrop { touch-action: pan-y pinch-zoom; }
    @media (prefers-reduced-motion: reduce) {
      .embedded body { transition: none; }
    }

    .tune-link {
      position: fixed;
      bottom: 16px;
      right: 20px;
      padding: 8px;
      font: 13px system-ui, sans-serif;
      color: #666;
      text-underline-offset: 3px;
    }
    .tuning .tune-link { display: none; }
    /* DialKit sets its viewport limit inline. Reserve space to interact with the artwork. */
    .tuning .dialkit-panel-inner { max-height: min(70svh, 620px) !important; }
    @media (max-width: 700px) {
      .tuning main { box-sizing: border-box; padding-bottom: 36svh; }
      .tuning .dialkit-panel-inner { max-height: 45svh !important; }
    }
  </style>
  <script defer src="./depth.js"></script>
  <script defer src="./sound.js?v=tuned-mix"></script>
  <script defer src="./letters.js?v=idle-background-clicks"></script>
</head>
