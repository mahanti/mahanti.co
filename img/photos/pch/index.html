<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arjun Mahanti - Designer</title> 
  <meta name="description" content="Selected work by Arjun Mahanti"></meta>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    [data-animate] {
      --stagger: 0;
      --delay: 120ms;
      --start: 0ms;
      animation: fade-in-up 0.6s both;
      animation-delay: calc(var(--stagger) * var(--delay) + var(--start));
    }
    [data-animation-controller="false"] [data-animate] { animation: none; }
    @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { [data-animate] { animation: none; } }
    footer.site-footer {
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--text-subtle, #777);
      font-size: 14px;
      border-top: 1px solid var(--border, rgba(0,0,0,0.08));
    }
    .site-footer .col-8.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0;
      width: 100%;
    }
    .site-footer .subtitle { opacity: 0.3; margin: 0; }
    .footer-time-left, .footer-time-right { display: inline-flex; align-items: center; gap: 6px; }
    .footer-time-right { text-align: right; }
    .footer-clock {
      --sec-deg: calc((var(--now-s) / 60) * 360);
      --min-deg: calc(((var(--now-m) / 60) * 360) + ((var(--now-s) / 60) * 6));
      --hour-deg: calc(((var(--now-h) / 12) * 360) + ((var(--now-m) / 60) * 30));
      --hand-w: 1px;
      --hand-color: var(--text-subtle, #777);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border, #ccc);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform: rotate(180deg);
      margin-left: 12px;
    }
    .footer-clock::before { content: ""; width: 1px; height: 1px; border-radius: 50%; background: var(--hand-color); position: absolute; z-index: 2; }
    .footer-clock .hand { position: absolute; top: 50%; left: calc(50% - var(--hand-w) / 2); width: var(--hand-w); background: var(--hand-color); border-radius: calc(var(--hand-w) / 2); transform-origin: center 0; }
    .footer-clock .hand.second { height: 9px; transform: rotate(calc(var(--sec-deg) * 1deg)); }
    .footer-clock .hand.minute { height: 8px; transform: rotate(calc(var(--min-deg) * 1deg)); }
    .footer-clock .hand.hour { height: 6px; transform: rotate(calc(var(--hour-deg) * 1deg)); }
  </style>
</head>
<body data-animation-controller="true">
  <div id="container">
    <section id="nav">
      <div class="row nav-row">
        <div class="text-section">
          <a href="/"><span id="name" class="title">Arjun Mahanti</span></a>
          <span class="subtitle hideable">A midwesterner in Brooklyn building, designing, and crafting products.</span>
        </div>
        <div class="button-section">
          <nav>
            <ul class="navlist">
              <li><a class="button-link" href="/work">Work</a></li>
              <li><a class="button-link" href="/products">Products</a></li>
              <li><a class="button-link" href="/photos">Photos</a></li>
              <li><a class="button-link" href="/about">About</a></li>
            </ul>
          </nav>
           <a href="#" class="navlist-button"></a>
        </div>
      </div>
    </section> 
    <section id="header-generic" class="color-generic">			
      <div class="row">
        <span class="title">Pacific Coast Highway</span>
        <span class="subtitle">Film from our drive down the PCH.</span>
      </div>
    </section>
    <section>
      <img src="01.jpg">
    </section>
    <section>
      <img src="02.jpg">
    </section>
    <section>
      <img src="03.jpg">
    </section>
    <section>
      <img src="04.jpg">
    </section>
    <section>
      <img src="05.jpg">
    </section>
    <section>
      <img src="06.jpg">
    </section>
    <section>
      <img src="07.jpg">
    </section>
    <section>
      <img src="08.jpg">
    </section>
    <section>
      <img src="09.jpg">
    </section>
    <section>
      <img src="10.jpg">
    </section>
  </div>
  <footer class="site-footer" data-animate style="--stagger:8">
    <div class="col-8 row">
      <span class="subtitle footer-time">© <span data-year>2025</span> Arjun Mahanti — <span data-time><span class="hours">--</span>:<span class="minutes">--</span>:<span class="seconds">--</span></span></span>
    </div>
  </footer>
  <script data-site-enhance>
    (() => {
      const root = document.querySelector('[data-animation-controller]');
      if (root) {
        const candidates = root.querySelectorAll(
          '[data-animate], .carousel, section, hr.divider, footer.site-footer'
        );
        candidates.forEach(el => {
          if (!el.hasAttribute('data-animate')) el.setAttribute('data-animate', '');
        });
        const targets = root.querySelectorAll('[data-animate]');
        targets.forEach((el, i) => {
          if (!el.style.getPropertyValue('--stagger')) {
            el.style.setProperty('--stagger', String(i + 1));
          }
        });
      }
      const year = document.querySelector('[data-year]');
      if (year) year.textContent = String(new Date().getFullYear());
      const timeEl = document.querySelector('[data-time]');
      if (timeEl) {
        const hours = timeEl.querySelector('.hours');
        const minutes = timeEl.querySelector('.minutes');
        const seconds = timeEl.querySelector('.seconds');
        const pad = n => String(n).padStart(2, '0');
        const tick = () => {
          const now = new Date();
          if (hours) hours.textContent = pad(now.getHours());
          if (minutes) minutes.textContent = pad(now.getMinutes());
          if (seconds) seconds.textContent = pad(now.getSeconds());
        };
        tick();
        setInterval(tick, 500);
      }
    })();
  </script>
  <script src="/js/script.js"></script>
</body>
</html>
