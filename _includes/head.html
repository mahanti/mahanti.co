<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ site.title | escape }} {{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  <style>
    [data-animate] {
      --stagger: 0;
      --delay: 120ms;
      --start: 0ms;
      animation: fade-in-up 0.6s both;
      animation-delay: calc(var(--stagger) * var(--delay) + var(--start));
    }
    [data-animation-controller="false"] [data-animate] {
      animation: none;
    }
    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animate] { animation: none; }
    }
    footer.site-footer {
      padding: 24px 0;
      display: block;
      color: var(--text-subtle, #777);
      font-size: 14px;
      width: 100%;
    }
    .site-footer .col-8.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    .footer-time-left {
      flex-shrink: 1;
      min-width: 0;
    }
    .site-footer .subtitle {
      opacity: 0.3;
      margin: 0;
    }
    .grid.page-content {
      padding-bottom: 24px;
    }
    .footer-time-left,
    .footer-time-right,
    .footer-time {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .footer-time-right {
      text-align: right;
      flex-shrink: 0;
    }
  </style>
  <script src="/js/min.script.js"></script>
  <script src="/js/medium-zoom.min.js"></script>
  <script>
    (function() {
      // Theme management
      function getStoredTheme() {
        return localStorage.getItem('theme') || 'day';
      }
      
      function setTheme(theme) {
        document.body.classList.remove('day', 'night');
        document.body.classList.add(theme);
        localStorage.setItem('theme', theme);
      }
      
      function toggleTheme() {
        var currentTheme = document.body.classList.contains('night') ? 'night' : 'day';
        var newTheme = currentTheme === 'night' ? 'day' : 'night';
        setTheme(newTheme);
      }
      
      // Initialize theme
      function initTheme() {
        var theme = getStoredTheme();
        setTheme(theme);
        
        // Add toggle button if it doesn't exist
        if (!document.getElementById('theme-toggle')) {
          var toggle = document.createElement('button');
          toggle.id = 'theme-toggle';
          toggle.className = 'theme-toggle';
          toggle.setAttribute('aria-label', 'Toggle theme');
          toggle.onclick = toggleTheme;
          document.body.appendChild(toggle);
        }
      }
      
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTheme);
      } else {
        initTheme();
      }
    })();
  </script>
</head>
