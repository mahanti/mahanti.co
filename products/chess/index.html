<style>
  .chessmono-color-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    width: 100%;
    min-height: 664px;
    padding: 80px 24px;
    margin: 0 0 16px;
    overflow: hidden;
    border-radius: 32px;
    background: color-mix(in srgb, var(--surface-10) 50%, transparent);
  }

  .chessmono-color-stage .chessmono-picker {
    position: absolute;
    left: 50%;
    bottom: -56px;
    transform: translateX(-50%);
  }

  .chessmono-device {
    position: relative;
    overflow: hidden;
    width: min(38%, 244px);
    aspect-ratio: 860 / 1586;
    margin: 0;
    background: transparent;
    border-radius: 32px;
  }

  .chessmono-device img {
    position: absolute;
    inset: 0;
    width: 100% !important;
    max-width: 100% !important;
    height: 100%;
    margin: 0 !important;
    object-fit: contain;
    border-radius: 32px;
    background: transparent;
  }

  .chessmono-device .chessmono-active-image {
    z-index: 1;
  }

  .chessmono-device .chessmono-next-image {
    z-index: 2;
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    transition: clip-path 520ms cubic-bezier(0.68, 0, 0.22, 1), opacity 1ms linear 520ms;
  }

  .chessmono-device.is-animating .chessmono-next-image {
    opacity: 1;
    transition: clip-path 520ms cubic-bezier(0.68, 0, 0.22, 1);
  }

  .chessmono-device.is-animating[data-direction="forward"] .chessmono-next-image {
    clip-path: inset(0 0 0 0);
  }

  .chessmono-device[data-direction="backward"] .chessmono-next-image {
    clip-path: inset(0 0 0 100%);
  }

  .chessmono-device.is-animating[data-direction="backward"] .chessmono-next-image {
    clip-path: inset(0 0 0 0);
  }

  .chessmono-picker {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 0;
  }

  .chessmono-swatch {
    position: relative;
    width: 16px;
    height: 16px;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }

  .chessmono-swatch::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--swatch);
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12);
    transform: translate(-50%, -50%);
  }

  .chessmono-swatch::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background: #fff;
    border: 0;
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.5);
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .chessmono-swatch[aria-pressed="true"]::after {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .chessmono-swatch:focus-visible {
    outline: none;
  }

  .chessmono-swatch[data-color="black"],
  .chessmono-swatch[data-bg="#000000"] {
    box-shadow: none;
  }

  .chessmono-swatch[data-color="black"]::before,
  .chessmono-swatch[data-bg="#000000"]::before {
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18);
  }

  .chessmono-iconography .carousel-slide {
    width: 280px;
  }

  .chessmono-icon-card {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 280px;
    height: 360px;
    border-radius: 32px;
    background: color-mix(in srgb, var(--surface-10) 50%, transparent);
  }

  .chessmono-iconography .carousel-slide,
  .chessmono-iconography .chessmono-icon-card,
  .chessmono-device,
  .chessmono-app-icon {
    transform-origin: center center;
  }

  .chessmono-icon-card img {
    width: 52% !important;
    max-width: 52% !important;
    height: auto !important;
    margin: 0 !important;
    border-radius: 0 !important;
    background: transparent;
  }

  .chessmono-app-icon-stage {
    position: relative;
    display: flex;
    min-height: 560px;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 84px;
    margin: 0 0 16px;
    overflow: hidden;
    border-radius: 32px;
    background: color-mix(in srgb, var(--surface-10) 50%, transparent);
  }

  .chessmono-app-icon {
    position: relative;
    display: grid;
    place-items: center;
    width: min(54%, 320px);
    aspect-ratio: 1;
    border-radius: 28.571%;
    background: var(--app-icon-bg, #000);
    overflow: hidden;
    transition: background-color 180ms ease;
  }

  .chessmono-app-icon::before,
  .chessmono-app-icon::after {
    content: "";
    position: absolute;
    width: 39%;
    height: 39%;
    background: rgba(255, 255, 255, 0.18);
  }

  .chessmono-app-icon::before {
    right: 10%;
    top: 10%;
    border-radius: 12% 48% 12% 12%;
  }

  .chessmono-app-icon::after {
    left: 10%;
    bottom: 10%;
    border-radius: 12% 12% 12% 48%;
  }

  .chessmono-app-icon img {
    position: relative;
    z-index: 1;
    width: 42% !important;
    max-width: 42% !important;
    height: auto !important;
    margin: 0 !important;
    border-radius: 0 !important;
    background: transparent;
    filter: invert(1);
  }

  .chessmono-app-controls {
    position: absolute;
    left: 50%;
    bottom: -60px;
    display: grid;
    gap: 16px;
    justify-items: center;
    transform: translateX(-50%);
  }

  .chessmono-piece-picker,
  .chessmono-app-color-picker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chessmono-piece-button {
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    padding: 0;
    background: transparent;
    cursor: pointer;
    opacity: 0.42;
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .chessmono-piece-button img {
    width: 12px !important;
    max-width: 12px !important;
    height: 12px !important;
    margin: 0 !important;
    border-radius: 0 !important;
    background: transparent;
  }

  .chessmono-piece-button[aria-pressed="true"],
  .chessmono-piece-button:hover,
  .chessmono-piece-button:focus-visible {
    opacity: 1;
  }

  .chessmono-piece-button:focus-visible,
  .chessmono-app-color-picker .chessmono-swatch:focus-visible {
    outline: none;
    transform: scale(1.12);
  }

  @media (prefers-reduced-motion: reduce) {
    .chessmono-device .chessmono-next-image,
    .chessmono-device.is-animating .chessmono-next-image {
      transition: none;
    }
  }

  @media (max-width: 640px) {
    .chessmono-color-stage {
      min-height: 520px;
      padding: 64px 20px;
      border-radius: 20px;
    }

    .chessmono-color-stage .chessmono-picker {
      bottom: -40px;
    }

    .chessmono-device {
      width: min(46%, 196px);
      border-radius: 24px;
    }

    .chessmono-device img {
      border-radius: 24px;
    }

    .chessmono-icon-card,
    .chessmono-iconography .carousel-slide {
      width: 220px;
    }

    .chessmono-icon-card {
      height: 300px;
    }

    .chessmono-app-icon-stage {
      min-height: 420px;
      border-radius: 20px;
    }

    .chessmono-app-icon {
      width: min(62%, 220px);
    }

    .chessmono-piece-picker,
    .chessmono-app-color-picker {
      gap: 12px;
    }
  }
</style>
