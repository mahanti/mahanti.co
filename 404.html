<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arjun Mahanti</title>
  <meta name="description" content="A multidisciplinary designer building delightful solutions to complex problems.">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    [data-animate] {
      --stagger: 0;
      --delay: 120ms;
      --start: 0ms;
      animation: fade-in-up 0.6s both;
      animation-delay: calc(var(--stagger) * var(--delay) + var(--start));
    }
    [data-animation-controller="false"] [data-animate] {
      animation: none;
    }
    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-animate] { animation: none; }
    }
    footer.site-footer {
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--text-subtle, #777);
      font-size: 14px;
    }
    .site-footer .col-8.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0;
      width: 100%;
    }
    .site-footer .subtitle {
      opacity: 0.3;
      margin: 0;
    }
    .footer-time-left, .footer-time-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
  <script src="/js/min.script.js"></script>
  <script src="/js/medium-zoom.min.js"></script>
  <script>
    // SPA redirect for GitHub Pages
    (function() {
      console.log('[404] SPA redirect script loaded', {
        timestamp: new Date().toISOString(),
        url: window.location.href,
        pathname: window.location.pathname,
        search: window.location.search,
        hash: window.location.hash
      });

      // Store the current path for the SPA to handle
      const path = window.location.pathname;
      const search = window.location.search;
      
      console.log('[404] Redirecting to index with stored path:', path);
      
      // Store path in sessionStorage so SPA can pick it up
      try {
        sessionStorage.setItem('spa_redirect_path', path + search);
      } catch (e) {
        console.warn('[404] Failed to store redirect path:', e);
      }
      
      // Replace the current URL with the index page
      // This preserves the URL in the address bar while loading the SPA
      window.history.replaceState(null, null, path + search);
      
      // Load the main SPA page content
      fetch('/')
        .then(response => response.text())
        .then(html => {
          // Replace current page content with index.html
          document.documentElement.innerHTML = html;
          
          // Execute any scripts in the loaded content
          const scripts = document.querySelectorAll('script');
          scripts.forEach(script => {
            if (script.src) {
              const newScript = document.createElement('script');
              newScript.src = script.src;
              newScript.onload = () => {
                console.log('[404] Script loaded:', script.src);
              };
              document.head.appendChild(newScript);
            } else if (script.textContent) {
              const newScript = document.createElement('script');
              newScript.textContent = script.textContent;
              document.head.appendChild(newScript);
            }
          });
        })
        .catch(error => {
          console.error('[404] Failed to load SPA:', error);
          // Fallback content
          document.body.innerHTML = `
            <div style="padding: 2rem; text-align: center;">
              <h1>Page Not Found</h1>
              <p>The page you're looking for doesn't exist.</p>
              <a href="/">Go Home</a>
            </div>
          `;
        });
    })();
    
    // Auto theme switching (same as index.html)
    (function() {
      var hasStarted = false;
      function applyThemeForNow(now) {
        var hours = now.getHours();
        var isNight = (hours >= 19 || hours < 7);
        var body = document.body;
        if (!body) return;
        body.classList.remove('day', 'night');
        body.classList.add(isNight ? 'night' : 'day');
      }

      function msUntilNextSwitch(now) {
        var next = new Date(now);
        var hours = now.getHours();
        if (hours < 7) {
          next.setHours(7,0,0,0);
        } else if (hours < 19) {
          next.setHours(19,0,0,0);
        } else {
          next.setDate(next.getDate() + 1);
          next.setHours(7,0,0,0);
        }
        return Math.max(0, next.getTime() - now.getTime());
      }

      function schedule() {
        var now = new Date();
        applyThemeForNow(now);
        var delay = msUntilNextSwitch(now);
        if (delay === 0) {
          delay = 1000;
        }
        setTimeout(schedule, delay);
      }

      function start() {
        if (hasStarted) return;
        hasStarted = true;
        if (document.body) {
          applyThemeForNow(new Date());
        }
        schedule();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
      window.addEventListener('load', start);
    })();
  </script>
</head>
<body class="day loading" data-animation-controller="true">
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh;" data-animate>
    <div style="text-align: center;">
      <h2>Loading...</h2>
      <p>Redirecting to the requested page...</p>
    </div>
  </div>
  <hr class="divider">
  <footer class="site-footer" data-animate style="--stagger:8">
    <div class="col-8 row">
      <span class="subtitle footer-time-left">© <span data-year>2025</span> Arjun Mahanti</span>
      <span class="subtitle footer-time-right" data-time><span class="hours">--</span>:<span class="minutes">--</span>:<span class="seconds">--</span></span>
    </div>
  </footer>
  <script data-site-enhance>
    (() => {
      const root = document.querySelector('[data-animation-controller]');
      if (root) {
        const candidates = root.querySelectorAll(
          '[data-animate], .carousel, section, hr.divider, footer.site-footer'
        );
        candidates.forEach(el => {
          if (!el.hasAttribute('data-animate')) {
            el.setAttribute('data-animate', '');
          }
        });
        const targets = root.querySelectorAll('[data-animate]');
        targets.forEach((el, i) => {
          if (!el.style.getPropertyValue('--stagger')) {
            el.style.setProperty('--stagger', String(i + 1));
          }
        });
      }

      const year = document.querySelector('[data-year]');
      if (year) year.textContent = String(new Date().getFullYear());

      const timeEl = document.querySelector('[data-time]');
      if (timeEl) {
        const hours = timeEl.querySelector('.hours');
        const minutes = timeEl.querySelector('.minutes');
        const seconds = timeEl.querySelector('.seconds');
        const pad = n => String(n).padStart(2, '0');
        const tick = () => {
          const now = new Date();
          if (hours) hours.textContent = pad(now.getHours());
          if (minutes) minutes.textContent = pad(now.getMinutes());
          if (seconds) seconds.textContent = pad(now.getSeconds());
        };
        tick();
        setInterval(tick, 500);
      }
    })();
  </script>
  <script src="/js/script.js"></script>
</body>
</html>
